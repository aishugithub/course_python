<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foothold — Learn Python</title>
    <meta name="description" content="A free, self-paced Python course for absolute beginners. Type real Python in your browser from the first lesson: about 460 small programs, checked instantly, with hints when you are stuck. No install, no cost, no account needed to start." />
    <link rel="canonical" href="https://aishugithub.github.io/course_python/" />

    <!-- Link previews (WhatsApp, LinkedIn, X …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foothold" />
    <meta property="og:title" content="Foothold — Learn Python by typing it" />
    <meta property="og:description" content="A free, self-paced Python course for absolute beginners. Type real Python in your browser from the first lesson: about 460 small programs, checked instantly, with hints when you are stuck. No install, no cost, no account needed to start." />
    <meta property="og:url" content="https://aishugithub.github.io/course_python/" />
    <meta property="og:image" content="https://aishugithub.github.io/course_python/brand/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Tells search engines this is a course -->
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Course","name":"Foothold — Python Programming","description":"A free, self-paced Python course for absolute beginners. Type real Python in your browser from the first lesson: about 460 small programs, checked instantly, with hints when you are stuck. No install, no cost, no account needed to start.","url":"https://aishugithub.github.io/course_python/","isAccessibleForFree":true,"inLanguage":"en","educationalLevel":"Beginner","provider":{"@type":"Organization","name":"Foothold","url":"https://aishugithub.github.io/course_python/"}}
    </script>

    <!-- Brand favicons (from Foothold python_branding/brand, copied to public/brand).
         Vite copies public/ to the site root, so ./brand/... works with the
         /course_python/ base path on GitHub Pages. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./brand/apple-touch-icon-180.png" />
    <!-- Mobile browser chrome matches the app's cream page background. -->
    <meta name="theme-color" content="#F1EEE6" />

    <!-- Brand fonts: Space Grotesk (headings/UI) + Space Mono (code/kickers).
         Used by the Landing page; lessons keep their own system-ui styling. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Foothold is a free, interactive Python course for beginners. It runs Python in your browser, so it needs JavaScript switched on.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
